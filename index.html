    /* Scroll styling */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }

<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbyhpqwlzs3SopGhZcqy525nBHalfCg9nbvKSRygrdpAZ5DNvvEbfjBanrnSWieNar8V/exec";

    const FALLBACK_NOSS_DB = {
      "MC-024-4:2012": {
        code: "MC-024-4:2012",
        title: "PENGURUSAN TEKNOLOGI KIMPALAN",
        tahap: "4",
        cus: [
          {
            id: "CU1",
            code: "MC-024-4:2012-C01",
            title: "WELDING PROCEDURE SPECIFICATION (WPS) & PQR DEVELOPMENT",
            was: [
              { id: "WA1", code: "C01-W01", title: "Review welding procedure specification requirements.", rk: "Welding codes, ASME IX, AWS D1.1, WPS/PQR variables.", rkHours: 25, rs: "Inspect joint design and base metal specifications.", rsHours: 55 },
              { id: "WA2", code: "C01-W02", title: "Prepare welder qualification test coupon.", rk: "Welder qualification testing criteria & certification rules.", rkHours: 30, rs: "Prepare welder test coupon identification tags.", rsHours: 65 },
              { id: "WA3", code: "C01-W03", title: "Supervise welding testing activities.", rk: "Destructive & Non-Destructive Testing (NDT) procedures.", rkHours: 40, rs: "Monitor coupon welding, arrange lab tensile/bend tests.", rsHours: 90 }
            ]
          },
          {
            id: "CU2",
            code: "MC-024-4:2012-C02",
            title: "WELDING INSPECTION & QUALITY ASSURANCE IMPLEMENTATION",
            was: [
              { id: "WA1", code: "C02-W01", title: "Establish Inspection & Test Plan (ITP).", rk: "Quality assurance concepts, ISO 3834, ITP hold points.", rkHours: 20, rs: "Draft ITP matrix, determine third-party inspection stages.", rsHours: 60 },
              { id: "WA2", code: "C02-W02", title: "Conduct visual inspection on welded joints.", rk: "Visual inspection criteria (AWS D1.1 / ASME V), weld defects.", rkHours: 25, rs: "Use bridge cam gauge, weld fillet gauge, record undercut.", rsHours: 70 },
              { id: "WA3", code: "C02-W03", title: "Evaluate Non-Destructive Testing (NDT) reports.", rk: "RT, UT, MT, PT principles, acceptance criteria.", rkHours: 35, rs: "Review radiography films, cross-check UT flaw sizing.", rsHours: 80 }
            ]
          },
          {
            id: "CU3",
            code: "MC-024-4:2012-C03",
            title: "WELDING PRODUCTION PLANNING & CONTROL",
            was: [
              { id: "WA1", code: "C03-W01", title: "Estimate welding consumable requirements.", rk: "Deposition efficiency, filler wire formulas, gas flow rates.", rkHours: 25, rs: "Calculate required weld metal weight, plan electrode baking.", rsHours: 50 },
              { id: "WA2", code: "C03-W02", title: "Formulate welding schedule and resource allocation.", rk: "Gantt charts, welder productivity rates, sequence control.", rkHours: 30, rs: "Plot project timelines, assign qualified welders.", rsHours: 60 }
            ]
          }
        ]
      }
    };

    const INITIAL_MODULES = [];

    // Helper: Bersihkan nombor tahap (cth: "Bermula Tahap 5" -> "5", "Tahap 4" -> "4")
    function cleanTahapNumber(rawTahap) {
      if (!rawTahap) return "4";
      const str = String(rawTahap).trim();
      const match = str.match(/\d+/);
      return match ? match[0] : str;
    }

    // Helper: Format Kod SKPK & Tahap (buang perkataan TAHAP bertindih)
    function formatSkpkCodeWithTahap(progCode, rawTahap) {
      if (!progCode) return "";
      const cleaned = cleanTahapNumber(rawTahap);
      return `${progCode} (Tahap ${cleaned})`;
    }

    // Normalisasi struktur NOSS
    function normalizeNossData(rawData) {
      if (!rawData || typeof rawData !== 'object') return {};
      const normalized = {};

      Object.keys(rawData).forEach(progCode => {
        if (progCode === '_ACTIVE_NOSS_SELECTION_') return; // Abaikan entri metadata
        const item = rawData[progCode];
        const progTitle = item.name || item.title || progCode;
        const progTahap = item.tahap || '4';

        const cusList = (item.cus || []).map((cu, cIdx) => {
          const cuId = cu.id || `CU${cIdx + 1}`;
          const cuCode = cu.code || `${progCode}-C0${cIdx + 1}`;
          const cuTitle = cu.title || cu.name || cuCode;

          const wasList = (cu.was || []).map((wa, wIdx) => {
            const waId = `WA${wIdx + 1}`;
            if (typeof wa === 'string') {
              return {
                id: waId,
                code: `${cuCode}-W0${wIdx + 1}`,
                title: wa,
                rk: `Pengetahuan teori berkaitan ${wa}`,
                rs: `Kemahiran praktikal ${wa}`,
                rkHours: 20,
                rsHours: 40
              };
            }
            return {
              id: wa.id || waId,
              code: wa.code || `${cuCode}-W0${wIdx + 1}`,
              title: wa.title || wa.name || `Tugasan ${waId}`,
              rk: wa.rk || `Pengetahuan teori berkaitan ${wa.title || ''}`,
              rs: wa.rs || `Kemahiran amali ${wa.title || ''}`,
              rkHours: Number(wa.rkHours) || 20,
              rsHours: Number(wa.rsHours) || 40
            };
          });

          return {
            id: cuId,
            code: cuCode,
            title: cuTitle,
            was: wasList
          };
        });

        normalized[progCode] = {
          code: progCode,
          title: progTitle,
          tahap: progTahap,
          cus: cusList
        };
      });

      return normalized;
    }

    function App() {
      const [activeTab, setActiveTab] = useState("tab1");
      const [nossDatabase, setNossDatabase] = useState(FALLBACK_NOSS_DB);
      
      // MULTI-PROGRAM SELECTION STATE
      // Menyokong gabungan berbilang NOSS: array kod program yang dipilih
      const [selectedNossCodes, setSelectedNossCodes] = useState(() => {
        const saved = localStorage.getItem("noss_active_program");
        return saved ? [saved] : [];
      });
      const [showAddProgramDropdown, setShowAddProgramDropdown] = useState(false);

      // MAKLUMAT AGENSI & PROGRAM BOLEH DISUNTING (TAB 2)
      const [agencyName, setAgencyName] = useState("KOLEJ KEMAHIRAN VOKASIONAL SERI ISKANDAR");
      const [programName, setProgramName] = useState("DIPLOMA TEKNOLOGI KIMPALAN & FABRIKASI");

      const [modules, setModules] = useState(INITIAL_MODULES);

      // STATUS SINKRONISASI KOLABORASI REAL-TIME
      const [isCloudSaving, setIsCloudSaving] = useState(false);
      const [isCloudLoading, setIsCloudLoading] = useState(false);
      const [lastSyncTime, setLastSyncTime] = useState("");
      const [lastSyncUser, setLastSyncUser] = useState("");
      const [cloudStatusMsg, setCloudStatusMsg] = useState("");
      
      // REFS UNTUK AUTO-SAVE & AUTO-SYNC TANPA GANGGUAN
      const isDataLoadedRef = useRef(false);
      const saveTimeoutRef = useRef(null);
      
      // KAWALAN SEKURITI & KOLABORASI (SEMAKAN TAB 'DO' & PASSKEY DIJANA OTOMATIK OLEH SKRIP)
      // 'DO' = Pegawai dalam Tab DO (Akses penuh termasuk tambah/buang program NOSS + lihat passkey harian)
      // 'PEMBANTU' = Kolaborasi melalui passkey yang dijana skrip (Boleh buat semua hal KECUALI tambah program)
      // 'GUEST' = Paparan sahaja (Terkunci sehingga disahkan melalui emel DO atau passkey kolaborasi)
      const [userRole, setUserRole] = useState(() => localStorage.getItem("noss_user_role") || "GUEST");
      const [doProfile, setDoProfile] = useState(() => {
        try { return JSON.parse(localStorage.getItem("noss_do_profile") || "null"); } catch (e) { return null; }
      });
      const [dailyAutoPasskey, setDailyAutoPasskey] = useState(() => localStorage.getItem("noss_daily_passkey") || "");
      const [doSessions, setDoSessions] = useState(() => {
        try { return JSON.parse(localStorage.getItem("noss_do_sessions") || "[]"); } catch (e) { return []; }
      });
      const [activeSessionId, setActiveSessionId] = useState(() => localStorage.getItem("noss_active_session_id") || "DEFAULT");
      const [activeSessionLabel, setActiveSessionLabel] = useState(() => localStorage.getItem("noss_active_session_label") || "");
      const [sessionExpiresAt, setSessionExpiresAt] = useState(() => Number(localStorage.getItem("noss_session_expires_at") || 0));
      const [newSessionLabel, setNewSessionLabel] = useState("");
      const [sessionBusy, setSessionBusy] = useState(false);
      const [showPasskeyModal, setShowPasskeyModal] = useState(false);
      const [authTabMode, setAuthTabMode] = useState("DO"); // "DO" | "PEMBANTU"
      const [inputPasskey, setInputPasskey] = useState("");
      const [authLoading, setAuthLoading] = useState(false);
      const [passkeyError, setPasskeyError] = useState("");
      const [copiedPasskey, setCopiedPasskey] = useState(false);

      
      // FUNGSI SIMPAN PEMETAAN KE CLOUD GOOGLE SHEETS ('KOLABORASI' MENGIKUT SESI)
      const handleSaveToCloud = async (isSilent = false) => {
        setIsCloudSaving(true);
        if (!isSilent) setCloudStatusMsg("Menyimpan ke Cloud...");
        try {
          const payload = {
            action: 'saveCollaborativeData',
            sessionId: activeSessionId || 'DEFAULT',
            editorName: userRole === 'DO' ? (doProfile?.name || 'Pegawai DO') : `Pembantu (${activeSessionLabel || 'Kolaborasi'})`,
            data: {
              selectedNossCodes,
              modules,
              manualCompliance,
              gapRemarks,
              committeeRemarks,
              agencyName,
              programName
            }
          };

          const res = await fetch(DEFAULT_GAS_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          const resJson = await res.json();
          if (resJson && resJson.success) {
            setLastSyncTime(resJson.lastUpdated);
            setLastSyncUser(resJson.updatedBy);
            setCloudStatusMsg("Disimpan ke Cloud");
          } else {
            setCloudStatusMsg("Gagal simpan");
          }
        } catch (err) {
          console.error("Ralat simpan ke cloud:", err);
          setCloudStatusMsg("Ralat sambungan");
        } finally {
          setIsCloudSaving(false);
          setTimeout(() => setCloudStatusMsg(""), 4000);
        }
      };

      // FUNGSI TARIK DATA PEMETAAN TERKINI DARI CLOUD GOOGLE SHEETS
      const handlePullFromCloud = async (isSilent = false, overrideSessionId = null) => {
        setIsCloudLoading(true);
        if (!isSilent) setCloudStatusMsg("Menarik data terkini...");
        const targetSess = overrideSessionId || activeSessionId || 'DEFAULT';
        try {
          const res = await fetch(`${DEFAULT_GAS_URL}?action=getCollaborativeData&sessionId=${encodeURIComponent(targetSess)}`);
          const json = await res.json();
          if (json && json.success && json.data) {
            const d = json.data;
            if (d.selectedNossCodes && d.selectedNossCodes.length > 0) setSelectedNossCodes(d.selectedNossCodes);
            if (d.modules && Array.isArray(d.modules)) setModules(d.modules);
            if (d.manualCompliance) setManualCompliance(d.manualCompliance);
            if (d.gapRemarks) setGapRemarks(d.gapRemarks);
            if (d.committeeRemarks) setCommitteeRemarks(d.committeeRemarks);
            if (d.agencyName) setAgencyName(d.agencyName);
            if (d.programName) setProgramName(d.programName);
            if (json.lastUpdated) setLastSyncTime(json.lastUpdated);
            if (json.updatedBy) setLastSyncUser(json.updatedBy);
            setCloudStatusMsg("Data terkini dimuatkan");
            return true;
          }
        } catch (e) {
          console.warn("Gagal menarik data kolaborasi:", e);
        } finally {
          setIsCloudLoading(false);
          setTimeout(() => setCloudStatusMsg(""), 4000);
        }
        return false;
      };

      // LOG MASUK GOOGLE RASMI MELALUI POPUP GOOGLE APPS SCRIPT (TIADA ERROR 401)
      const handleGoogleSignInClick = () => {
        setAuthLoading(true);
        setPasskeyError("");

        const width = 460;
        const height = 540;
        const left = window.screenX + (window.outerWidth - width) / 2;
        const top = window.screenY + (window.outerHeight - height) / 2;
        const popupUrl = `${DEFAULT_GAS_URL}?action=googleLoginPopup&origin=${encodeURIComponent(window.location.origin)}`;

        const popup = window.open(
          popupUrl,
          "GoogleDOAuthPopup",
          `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`
        );

        if (!popup || popup.closed || typeof popup.closed === "undefined") {
          setAuthLoading(false);
          setPasskeyError("Tetingkap pop-up disekat oleh pelayar anda. Sila benarkan pop-up (Allow Pop-ups) untuk laman ini dan cuba lagi.");
          return;
        }

        const handleAuthMessage = (event) => {
          if (event.data && event.data.type === "GAS_DO_AUTH_RESULT") {
            window.removeEventListener("message", handleAuthMessage);
            clearInterval(pollTimer);
            setAuthLoading(false);

            const result = event.data.payload;
            if (result && result.valid) {
              setUserRole("DO");
              const profile = { name: result.name, unit: result.unit, email: result.email };
              setDoProfile(profile);
              const sessionsList = result.sessions || [];
              setDoSessions(sessionsList);
              localStorage.setItem("noss_user_role", "DO");
              localStorage.setItem("noss_do_profile", JSON.stringify(profile));
              localStorage.setItem("noss_do_sessions", JSON.stringify(sessionsList));

              if (sessionsList.length > 0) {
                const first = sessionsList[0];
                setActiveSessionId(first.sessionId);
                setActiveSessionLabel(first.label);
                setDailyAutoPasskey(first.passkey);
                localStorage.setItem("noss_active_session_id", first.sessionId);
                localStorage.setItem("noss_active_session_label", first.label);
                localStorage.setItem("noss_daily_passkey", first.passkey);
              }
            } else {
              setPasskeyError((result && result.message) || "Akaun Google anda tidak tersenarai atau tidak aktif dalam Tab DO.");
            }
          }
        };

        window.addEventListener("message", handleAuthMessage);

        // Pantau jika pengguna menutup popup secara manual sebelum selesai
        const pollTimer = setInterval(() => {
          if (popup.closed) {
            clearInterval(pollTimer);
            window.removeEventListener("message", handleAuthMessage);
            setAuthLoading(false);
          }
        }, 600);
      };

      // URUS 5 SLOT SESI KOLABORASI DO (JANA / TUKAR / BATALKAN SESI 6 JAM)
      const handleManageDOSession = async (op, slotNum) => {
        if (!doProfile?.email) return;
        setSessionBusy(true);
        try {
          const progs = selectedNossCodes.join(",");
          const lbl = newSessionLabel.trim() || `Sesi Bengkel #${slotNum}`;
          const url = `${DEFAULT_GAS_URL}?action=manageSessions&email=${encodeURIComponent(doProfile.email)}&op=${op}&slot=${slotNum}&label=${encodeURIComponent(lbl)}&programs=${encodeURIComponent(progs)}`;
          const res = await fetch(url);
          const data = await res.json();
          if (data && data.success) {
            const list = data.sessions || [];
            setDoSessions(list);
            localStorage.setItem("noss_do_sessions", JSON.stringify(list));
            if (op === 'create') {
              setNewSessionLabel("");
              const created = list.find(s => Number(s.slot) === Number(slotNum));
              if (created) {
                setActiveSessionId(created.sessionId);
                setActiveSessionLabel(created.label);
                setDailyAutoPasskey(created.passkey);
                localStorage.setItem("noss_active_session_id", created.sessionId);
                localStorage.setItem("noss_active_session_label", created.label);
                localStorage.setItem("noss_daily_passkey", created.passkey);
              }
            }
          } else {
            alert((data && data.message) || "Gagal mengemas kini sesi kolaborasi.");
          }
        } catch (err) {
          alert("Ralat sambungan semasa mengurus sesi: " + err.message);
        } finally {
          setSessionBusy(false);
        }
      };

      const handleSelectActiveSession = async (sess) => {
        setActiveSessionId(sess.sessionId);
        setActiveSessionLabel(sess.label);
        setDailyAutoPasskey(sess.passkey);
        localStorage.setItem("noss_active_session_id", sess.sessionId);
        localStorage.setItem("noss_active_session_label", sess.label);
        localStorage.setItem("noss_daily_passkey", sess.passkey);
        if (sess.programs) {
          const codes = sess.programs.split(",").filter(c => nossDatabase[c]);
          if (codes.length > 0) setSelectedNossCodes(codes);
        }
        await handlePullFromCloud(false, sess.sessionId);
      };

      const handleVerifyCollaboratorPasskey = async (e) => {
        e.preventDefault();
        setPasskeyError("");
        const key = inputPasskey.trim().toUpperCase();
        if (!key) return;

        setAuthLoading(true);
        try {
          const url = `${DEFAULT_GAS_URL}?action=verifyPasskey&key=${encodeURIComponent(key)}`;
          const res = await fetch(url);
          const data = await res.json();
          if (data && data.valid) {
            setUserRole("PEMBANTU");
            setDoProfile(null);
            const sessId = data.sessionId || "DEFAULT";
            const sessLabel = data.label || `Sesi #${data.slot || 1}`;
            const expAt = Number(data.expiresAt) || 0;

            setActiveSessionId(sessId);
            setActiveSessionLabel(sessLabel);
            setSessionExpiresAt(expAt);

            localStorage.setItem("noss_user_role", "PEMBANTU");
            localStorage.setItem("noss_active_session_id", sessId);
            localStorage.setItem("noss_active_session_label", sessLabel);
            localStorage.setItem("noss_session_expires_at", String(expAt));
            localStorage.removeItem("noss_do_profile");

            if (data.programs && data.programs.length > 0) {
              const validProgs = data.programs.filter(c => nossDatabase[c]);
              if (validProgs.length > 0) setSelectedNossCodes(validProgs);
            }

            await handlePullFromCloud(true, sessId);
            setShowPasskeyModal(false);
            setInputPasskey("");
          } else {
            setPasskeyError((data && data.message) || "Passkey kolaborasi tidak sah atau tempoh 6 jam telah tamat.");
          }
        } catch (err) {
          setPasskeyError("Gagal menyemak passkey kolaborasi. Sila semak sambungan internet.");
        } finally {
          setAuthLoading(false);
        }
      };

      const handleCopyPasskey = (textToCopy) => {
        const val = textToCopy || dailyAutoPasskey;
        if (!val) return;
        navigator.clipboard.writeText(val);
        setCopiedPasskey(val);
        setTimeout(() => setCopiedPasskey(false), 2000);
      };

      const handleLogoutAccess = () => {
        setUserRole("GUEST");
        setDoProfile(null);
        setDailyAutoPasskey("");
        setDoSessions([]);
        setSessionExpiresAt(0);
        localStorage.removeItem("noss_user_role");
        localStorage.removeItem("noss_do_profile");
        localStorage.removeItem("noss_daily_passkey");
        localStorage.removeItem("noss_do_sessions");
        localStorage.removeItem("noss_session_expires_at");
        setShowPasskeyModal(false);
      };
      const [showAddModuleModal, setShowAddModuleModal] = useState(false);
      const [newModCode, setNewModCode] = useState("");
      const [newModTitle, setNewModTitle] = useState("");
      const [showAddSubModal, setShowAddSubModal] = useState(null); // holds modId when open
      const [newSubCode, setNewSubCode] = useState("");
      const [newSubName, setNewSubName] = useState("");
      const [newSubKnowledge, setNewSubKnowledge] = useState("");
      const [newSubRkHours, setNewSubRkHours] = useState(20);
      const [newSubSkills, setNewSubSkills] = useState("");
      const [newSubRsHours, setNewSubRsHours] = useState(40);
      const [collapsedCUs, setCollapsedCUs] = useState({});
      const [collapsedModules, setCollapsedModules] = useState({});
      
      const [showFullWA, setShowFullWA] = useState(true);
      const [showSubModules, setShowSubModules] = useState(true);
      const [focusMode, setFocusMode] = useState(false);
      const [hoveredWA, setHoveredWA] = useState(null);

      const [apiSuccessBadge, setApiSuccessBadge] = useState(false);
      const [manualCompliance, setManualCompliance] = useState({});
      const [gapRemarks, setGapRemarks] = useState({});
      const [committeeRemarks, setCommitteeRemarks] = useState({});

      // Auto-fetch data dari Google Apps Script secara senyap
      useEffect(() => {
        const fetchAuto = async () => {
          try {
            // 1. Semak sama ada URL ada parameter ?noss=... atau ?passkey=...
            const urlParams = new URLSearchParams(window.location.search);
            const paramNoss = urlParams.get("noss");
            const paramPasskey = urlParams.get("passkey");
            if (paramPasskey) {
              setInputPasskey(paramPasskey);
            }

            let finalUrl = DEFAULT_GAS_URL;
            if (!finalUrl.includes("action=")) {
              finalUrl += (finalUrl.includes("?") ? "&" : "?") + "action=getMappingData";
            }
            const res = await fetch(finalUrl);
            const data = await res.json();
            if (data && typeof data === 'object' && Object.keys(data).length > 0) {
              // 2. Ekstrak program aktif yang disimpan oleh DO di Google Apps Script
              const serverActiveCodes = data._ACTIVE_NOSS_SELECTION_?.activeCodes || [];
              const cleanDB = normalizeNossData(data);
              setNossDatabase(cleanDB);
              setApiSuccessBadge(true);

              // 3. Selaraskan pilihan program: Keutamaan kepada URL Param -> Pilihan Cloud DO -> LocalStorage
              if (paramNoss) {
                const list = paramNoss.split(",").filter(c => cleanDB[c]);
                if (list.length > 0) setSelectedNossCodes(list);
              } else if (serverActiveCodes.length > 0) {
                const validCodes = serverActiveCodes.filter(c => cleanDB[c]);
                if (validCodes.length > 0) {
                  setSelectedNossCodes(validCodes);
                  localStorage.setItem("noss_active_program", validCodes[0]);
                }
              }

              // Tarik data pemetaan kolaborasi (modul, petak tanda X, jam) dari awan Google Sheets secara automatik
              await handlePullFromCloud(true);
            }
          } catch (e) {
            console.log("Menggunakan dataset pangkalan data tempatan:", e);
          } finally {
            // Beri sedikit jeda supaya state stabil sebelum auto-save mula memantau perubahan
            setTimeout(() => {
              isDataLoadedRef.current = true;
            }, 1200);
          }
        };
        fetchAuto();
      }, []);

      // 1. AUTO-SAVE DEBOUNCE (SIMPAN AUTOMATIK KE CLOUD SETIAP KALI DATA BERUBAH)
      useEffect(() => {
        if (!isDataLoadedRef.current || userRole === "GUEST") return;
        if (modules.length === 0 && selectedNossCodes.length === 0) return;

        if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);

        saveTimeoutRef.current = setTimeout(() => {
          handleSaveToCloud(true);
        }, 2200); // 2.2 saat selepas pengguna selesai menanda/menaip

        return () => {
          if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
        };
      }, [modules, manualCompliance, gapRemarks, committeeRemarks, agencyName, programName, selectedNossCodes, userRole]);

      // 2. AUTO-SYNC PERIODIK (SEMAK & TARIK KEMASKINI RAKAN KOLABORATOR SECARA SENYAP SETIAP 30 SAAT)
      useEffect(() => {
        if (userRole === "GUEST") return;
        const syncInterval = setInterval(() => {
          if (isDataLoadedRef.current && !isCloudSaving && document.visibilityState === "visible") {
            handlePullFromCloud(true);
          }
        }, 30000); // 30 saat

        return () => clearInterval(syncInterval);
      }, [isCloudSaving, userRole]);

      
      // 4. SEMAK TAMAT TEMPOH SESI KOLABORASI 6 JAM SECARA AUTOMATIK
      useEffect(() => {
        if (userRole !== "PEMBANTU" || !sessionExpiresAt) return;
        const checkExpiry = () => {
          if (Date.now() > sessionExpiresAt) {
            alert("Tempoh sah 6 jam bagi sesi kolaborasi ini telah tamat. Sila dapatkan Passkey baharu daripada Pegawai DO.");
            handleLogoutAccess();
          }
        };
        checkExpiry();
        const timer = setInterval(checkExpiry, 30000);
        return () => clearInterval(timer);
      }, [userRole, sessionExpiresAt]);

      // 3. AMARAN JIKA PENGGUNA CUBA TUTUP/REFRESH TAB KETIKA SEDANG SIMPAN
      useEffect(() => {
        const handleBeforeUnload = (e) => {
          if (isCloudSaving) {
            e.preventDefault();
            e.returnValue = "Perubahan pemetaan sedang disimpan ke awan. Adakah anda pasti mahu keluar?";
            return e.returnValue;
          }
        };
        window.addEventListener("beforeunload", handleBeforeUnload);
        return () => window.removeEventListener("beforeunload", handleBeforeUnload);
      }, [isCloudSaving]);

      // SENARAI SEMUA PROGRAM YANG TERPILIH (MULTI-NOSS)
      const selectedPrograms = useMemo(() => {
        return selectedNossCodes
          .map(code => nossDatabase[code])
          .filter(Boolean);
      }, [selectedNossCodes, nossDatabase]);

      // TAMBAH / BUANG PROGRAM DARI GABUNGAN
      
      // Fungsi Segerak Program Aktif DO ke Google Apps Script (Cloud Sync)
      const syncActiveProgramsToCloud = async (codes) => {
        try {
          const progsStr = encodeURIComponent(codes.join(","));
          const syncUrl = `${DEFAULT_GAS_URL}?action=setActivePrograms&programs=${progsStr}`;
          await fetch(syncUrl);
        } catch (err) {
          console.warn("Gagal menyegerakkan program aktif ke cloud:", err);
        }
      };

      const handleAddProgram = (code) => {
        if (!code || selectedNossCodes.includes(code)) return;
        const updated = [...selectedNossCodes, code];
        setSelectedNossCodes(updated);
        setShowAddProgramDropdown(false);
        if (userRole === "DO") syncActiveProgramsToCloud(updated);
      };

      const handleRemoveProgram = (code) => {
        const updated = selectedNossCodes.filter(c => c !== code);
        setSelectedNossCodes(updated);
        if (userRole === "DO") syncActiveProgramsToCloud(updated);
      };

      // TUKAR PROGRAM UTAMA TUNGGAL (Jika guna dropdown mod biasa)
      const handlePrimaryProgramChange = (code) => {
        if (userRole !== "DO") {
          alert("Akses Terhad: Hanya Pegawai DO dibenarkan memilih atau menukar program NOSS.");
          return;
        }
        const updated = code ? [code] : [];
        setSelectedNossCodes(updated);
        if (code) {
          localStorage.setItem("noss_active_program", code);
        } else {
          localStorage.removeItem("noss_active_program");
        }
        syncActiveProgramsToCloud(updated);
      };

      // Covered WAs set
      const coveredWAIds = useMemo(() => {
        const set = new Set();
        modules.forEach(m => {
          m.subModules.forEach(sm => {
            (sm.matchedWAs || []).forEach(wId => set.add(wId));
          });
        });
        return set;
      }, [modules]);

      // CU Statistics merentasi semua program terpilih
      const allCuStats = useMemo(() => {
        const stats = {};
        selectedPrograms.forEach(prog => {
          (prog.cus || []).forEach(cu => {
            const totalWA = cu.was.length;
            const metWA = cu.was.filter(wa => coveredWAIds.has(`${cu.id}-${wa.id}`) || coveredWAIds.has(`${prog.code}-${cu.id}-${wa.id}`)).length;
            const pct = totalWA > 0 ? Math.round((metWA / totalWA) * 100) : 0;
            const missingWAs = cu.was.filter(wa => !coveredWAIds.has(`${cu.id}-${wa.id}`) && !coveredWAIds.has(`${prog.code}-${cu.id}-${wa.id}`));
            stats[`${prog.code}-${cu.id}`] = { totalWA, metWA, pct, missingWAs, hasAnyCoverage: metWA > 0, cuId: cu.id };
          });
        });
        return stats;
      }, [selectedPrograms, coveredWAIds]);

      // Formula Peratusan Liputan Modul: (Submodul yang ada 'X' / Jumlah Submodul) * 100
      const moduleStats = useMemo(() => {
        const stats = {};
        modules.forEach(m => {
          const totalSub = m.subModules.length;
          const coveredSubs = m.subModules.filter(sm => (sm.matchedWAs || []).length > 0).length;
          const pct = totalSub > 0 ? Math.round((coveredSubs / totalSub) * 100) : 0;
          stats[m.id] = {
            hasAny: coveredSubs > 0,
            coveredSubs,
            totalSub,
            pct
          };
        });
        return stats;
      }, [modules]);

      const toggleMatch = (subId, globalWaId) => {
        if (userRole === "GUEST") { setShowPasskeyModal(true); return; }
        setModules(prev => prev.map(m => ({
          ...m,
          subModules: m.subModules.map(sm => {
            if (sm.subId !== subId) return sm;
            const current = sm.matchedWAs || [];
            const exists = current.includes(globalWaId);
            const updated = exists ? current.filter(id => id !== globalWaId) : [...current, globalWaId];
            return { ...sm, matchedWAs: updated };
          })
        })));
      };

      const toggleCUCollapse = (cuKey) => {
        setCollapsedCUs(prev => ({ ...prev, [cuKey]: !prev[cuKey] }));
      };

      const handleToggleSubModules = () => {
        const next = !showSubModules;
        setShowSubModules(next);
        const newMap = {};
        modules.forEach(m => { newMap[m.id] = !next; });
        setCollapsedModules(newMap);
      };

      const deleteSubModule = (modId, subId) => {
        if (userRole === "GUEST") { setShowPasskeyModal(true); return; }
        if (!confirm("Adakah anda pasti untuk memadam Sub Modul ini?")) return;
        setModules(prev => prev.map(m => {
          if (m.id !== modId) return m;
          return { ...m, subModules: m.subModules.filter(sm => sm.subId !== subId) };
        }));
      };

      const deleteModule = (modId) => {
        if (userRole === "GUEST") { setShowPasskeyModal(true); return; }
        if (!confirm("Adakah anda pasti untuk memadam keseluruhan Modul ini beserta semua sub-modulnya?")) return;
        setModules(prev => prev.filter(m => m.id !== modId));
      };

      const handleOpenAddModule = () => {
        if (userRole === "GUEST") { setShowPasskeyModal(true); return; }
        const nextNum = modules.length + 1;
        setNewModCode(`M${nextNum}`);
        setNewModTitle("");
        setShowAddModuleModal(true);
      };

      const handleSaveNewModule = (e) => {
        e.preventDefault();
        if (!newModTitle.trim()) return;
        const modId = `MOD-${Date.now()}`;
        const codeStr = newModCode.trim() || `M${modules.length + 1}`;
        setModules(prev => [
          ...prev,
          {
            id: modId,
            code: codeStr,
            title: newModTitle.trim(),
            subModules: []
          }
        ]);
        setShowAddModuleModal(false);
      };

      const handleOpenAddSubModule = (modId) => {
        if (userRole === "GUEST") { setShowPasskeyModal(true); return; }
        const targetMod = modules.find(m => m.id === modId);
        const totalSubs = modules.reduce((acc, m) => acc + m.subModules.length, 0) + 1;
        setNewSubCode(`SS${String(totalSubs).padStart(2, '0')}`);
        setNewSubName("");
        setNewSubKnowledge("");
        setNewSubRkHours(20);
        setNewSubSkills("");
        setNewSubRsHours(40);
        setShowAddSubModal(modId);
      };

      const handleSaveNewSubModule = (e) => {
        e.preventDefault();
        if (!showAddSubModal || !newSubName.trim()) return;
        const newSub = {
          subId: `SM-${Date.now()}`,
          code: newSubCode.trim() || `SS${Date.now().toString().slice(-3)}`,
          name: newSubName.trim(),
          matchedWAs: [],
          knowledge: newSubKnowledge.trim() || `Perincian teori ${newSubName.trim()}`,
          rkHours: Number(newSubRkHours) || 0,
          skills: newSubSkills.trim() || `Perincian amali ${newSubName.trim()}`,
          rsHours: Number(newSubRsHours) || 0
        };
        setModules(prev => prev.map(m => {
          if (m.id !== showAddSubModal) return m;
          return { ...m, subModules: [...m.subModules, newSub] };
        }));
        setCollapsedModules(prev => ({ ...prev, [showAddSubModal]: false }));
        setShowAddSubModal(null);
      };

      const handleUpdateSubModuleField = (modId, subId, field, value) => {
        setModules(prev => prev.map(m => {
          if (m.id !== modId) return m;
          return {
            ...m,
            subModules: m.subModules.map(sm => {
              if (sm.subId !== subId) return sm;
              return { ...sm, [field]: value };
            })
          };
        }));
      };

      const toggleComplianceStatus = (gId, defaultStatus) => {
        if (userRole === "GUEST") { setShowPasskeyModal(true); return; }
        const current = manualCompliance[gId] !== undefined ? manualCompliance[gId] : defaultStatus;
        setManualCompliance({
          ...manualCompliance,
          [gId]: !current
        });
      };

      // Pelarasan tepat ketinggian header untuk mematri celah (tiada bayang tembus semasa skrol)
      const r2Top = showFullWA ? "top-[112px]" : "top-[36px]";
      const r3Top = showFullWA ? "top-[152px]" : "top-[76px]";

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            
            const sheet1Name = workbook.SheetNames.find(n => n.toLowerCase().includes("modul")) || workbook.SheetNames[0];
            const rows1 = XLSX.utils.sheet_to_json(workbook.Sheets[sheet1Name]);
            
            let subTopicMap = {};
            const sheet2Name = workbook.SheetNames.find(n => n.toLowerCase().includes("subtopic"));
            if (sheet2Name) {
              const rows2 = XLSX.utils.sheet_to_json(workbook.Sheets[sheet2Name]);
              rows2.forEach(r => {
                const sCode = String(r["Kod Sub Modul"] || "").trim();
                if (sCode) {
                  subTopicMap[sCode] = {
                    knowledge: r["Knowledge / Sub Topic"] || "",
                    rkHours: Number(r["Training Duration (Knowledge)"] || 0),
                    skills: r["Applied Skills / Sub Topic"] || "",
                    rsHours: Number(r["Training Duration (Applied Skills)"] || 0)
                  };
                }
              });
            }

            const newModulesMap = {};
            rows1.forEach((r, idx) => {
              const modCode = String(r["Kod Modul"] || `M${idx+1}`).trim();
              const modTitle = String(r["Nama Modul"] || "Modul Agensi").trim();
              const subCode = String(r["Kod Sub Modul"] || `SS0${idx+1}`).trim();
              const subName = String(r["Topik / Sub Modul / Elemen"] || `Topik ${idx+1}`).trim();
              
              const waCol = r["Padanan Kod WA NOSS (Pilihan / Optional)"] || r["Padanan Kod WA NOSS"] || "";
              const matchedList = String(waCol).split(",").map(s => s.trim()).filter(Boolean);

              if (!newModulesMap[modCode]) {
                newModulesMap[modCode] = {
                  id: `MOD-${modCode}`,
                  code: modCode,
                  title: modTitle,
                  subModules: []
                };
              }

              const stDetails = subTopicMap[subCode] || {};
              newModulesMap[modCode].subModules.push({
                subId: `SM-${subCode}-${idx}`,
                code: subCode,
                name: subName,
                matchedWAs: matchedList,
                knowledge: stDetails.knowledge || `Perincian teori ${subName}`,
                rkHours: stDetails.rkHours || 20,
                skills: stDetails.skills || `Perincian kemahiran amali ${subName}`,
                rsHours: stDetails.rsHours || 40
              });
            });

            const finalMods = Object.values(newModulesMap);
            if (finalMods.length > 0) {
              setModules(finalMods);
              alert("Data Excel berjaya dimuat naik dan dipadankan!");
            }
          } catch (err) {
            alert("Ralat semasa membaca fail Excel: " + err.message);
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const isMultiProgram = selectedPrograms.length > 1;

      return (
        <div className="flex flex-col min-h-screen">
          
          {/* HEADER UTAMA */}
          {!focusMode && (
            <header className="bg-slate-900 text-white shadow-md border-b border-slate-800 no-print">
              <div className="max-w-7xl mx-auto px-4 py-2 flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center space-x-2.5">
                  <div className="p-1.5 bg-indigo-600 rounded-lg text-white shadow">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                  </div>
                  <div>
                    <h1 className="text-base font-bold tracking-tight text-white">Sistem Pemetaan Kurikulum & SKPK (NOSS)</h1>
                  </div>
                </div>

                <div className="flex items-center flex-wrap gap-2 text-xs">
                  {/* SELECTOR NOSS UTAMA + BUTANG MULTI-NOSS (+ PROGRAM) */}
                  <div className="bg-slate-800 border border-slate-700 px-2 py-1 rounded-lg flex items-center gap-1.5 relative">
                    <span className="text-amber-400 font-bold text-[11px]">NOSS:</span>
                    
                    {/* Program Utama / Pertama: Dikunci untuk Kolaborator / Pembantu, Hanya DO Boleh Tukar */}
                    {userRole === "DO" ? (
                  <div className="space-y-3 text-xs max-h-[78vh] overflow-y-auto custom-scrollbar pr-1">
                    <div className="p-2.5 bg-amber-50 border border-amber-300 rounded-lg flex items-center justify-between">
                      <div>
                        <div className="flex items-center gap-1.5">
                          <span className="font-bold text-amber-900">👑 {doProfile?.name}</span>
                          <span className="text-[9px] bg-amber-200 text-amber-950 px-1.5 py-0.2 rounded font-bold">DO Aktif</span>
                        </div>
                        <p className="text-[10px] text-slate-600">{doProfile?.unit} ({doProfile?.email})</p>
                      </div>
                      <button
                        type="button"
                        onClick={handleLogoutAccess}
                        className="text-[11px] text-rose-600 hover:underline font-bold shrink-0"
                      >
                        Log Keluar
                      </button>
                    </div>

                    {/* PENGURUSAN 5 SLOT SESI KOLABORASI (HAD MASA 6 JAM SETIAP SESI) */}
                    <div className="p-3 bg-slate-900 text-white rounded-lg space-y-2.5 border border-slate-700">
                      <div className="flex items-center justify-between border-b border-slate-800 pb-1.5">
                        <span className="text-[11px] text-amber-300 font-bold">👥 Pengurusan Sesi Kolaborasi (Maksimum 5 Sesi)</span>
                        <span className="text-[10px] bg-emerald-900/80 text-emerald-300 border border-emerald-600/40 px-1.5 py-0.5 rounded font-mono">
                          Had: 6 Jam / Sesi
                        </span>
                      </div>

                      {/* Input nama label sesi baharu */}
                      <div className="flex items-center gap-1.5">
                        <input
                          type="text"
                          value={newSessionLabel}
                          onChange={(e) => setNewSessionLabel(e.target.value)}
                          placeholder="Label sesi (cth: Kumpulan Bengkel A)..."
                          className="flex-1 bg-slate-800 border border-slate-700 text-slate-100 rounded px-2 py-1 text-[11px] focus:ring-1 focus:ring-indigo-400"
                        />
                      </div>

                      {/* 5 Slot Sesi */}
                      <div className="space-y-1.5">
                        {[1, 2, 3, 4, 5].map(slotNum => {
                          const existing = doSessions.find(s => Number(s.slot) === slotNum);
                          const isCurrent = existing && activeSessionId === existing.sessionId;
                          const minsLeft = existing ? Math.max(0, Math.round((existing.expiresAt - Date.now()) / 60000)) : 0;
                          const hrsLeft = Math.floor(minsLeft / 60);
                          const remMins = minsLeft % 60;

                          return (
                            <div
                              key={slotNum}
                              className={`p-2 rounded border text-[11px] transition ${
                                isCurrent
                                  ? 'bg-indigo-950/90 border-indigo-400'
                                  : existing
                                  ? 'bg-slate-800/90 border-slate-700'
                                  : 'bg-slate-800/40 border-slate-800 border-dashed'
                              }`}
                            >
                              {existing ? (
                                <div className="space-y-1.5">
                                  <div className="flex items-center justify-between gap-1">
                                    <div className="flex items-center gap-1.5 truncate">
                                      <span className="bg-amber-400 text-slate-950 font-bold px-1.5 py-0.2 rounded text-[10px]">
                                        #{slotNum}
                                      </span>
                                      <span className="font-bold text-slate-100 truncate">{existing.label}</span>
                                    </div>
                                    <span className="text-[10px] font-mono text-emerald-400 shrink-0">
                                      ⏳ {hrsLeft}j {remMins}m
                                    </span>
                                  </div>

                                  <div className="flex items-center justify-between gap-1.5 bg-slate-950 px-2 py-1 rounded">
                                    <span className="font-mono font-bold text-amber-300 tracking-wider text-xs select-all">
                                      {existing.passkey}
                                    </span>
                                    <div className="flex items-center gap-1">
                                      <button
                                        type="button"
                                        onClick={() => handleCopyPasskey(existing.passkey)}
                                        className="bg-slate-700 hover:bg-slate-600 text-white px-2 py-0.5 rounded text-[10px]"
                                        title="Salin kod passkey"
                                      >
                                        {copiedPasskey === existing.passkey ? "✓ Disalin" : "Salin Kod"}
                                      </button>
                                      <button
                                        type="button"
                                        onClick={() => {
                                          const baseUrl = window.location.origin + window.location.pathname;
                                          const progs = existing.programs || selectedNossCodes.join(",");
                                          const shareUrl = `${baseUrl}?noss=${encodeURIComponent(progs)}&passkey=${encodeURIComponent(existing.passkey)}`;
                                          navigator.clipboard.writeText(shareUrl);
                                          alert(`Pautan Sesi #${slotNum} (${existing.label}) disalin! Sah untuk 6 jam.`);
                                        }}
                                        className="bg-emerald-700 hover:bg-emerald-600 text-white px-2 py-0.5 rounded text-[10px] font-semibold"
                                        title="Salin pautan terus untuk kolaborator"
                                      >
                                        Salin Link
                                      </button>
                                      {!isCurrent && (
                                        <button
                                          type="button"
                                          onClick={() => handleSelectActiveSession(existing)}
                                          className="bg-indigo-600 hover:bg-indigo-500 text-white px-2 py-0.5 rounded text-[10px]"
                                          title="Buka ruang kerja sesi ini"
                                        >
                                          Buka
                                        </button>
                                      )}
                                      <button
                                        type="button"
                                        disabled={sessionBusy}
                                        onClick={() => handleManageDOSession('revoke', slotNum)}
                                        className="text-rose-400 hover:text-rose-300 px-1 font-bold"
                                        title="Tamatkan sesi ini sekarang"
                                      >
                                        ✕
                                      </button>
                                    </div>
                                  </div>
                                </div>
                              ) : (
                                <div className="flex items-center justify-between text-slate-400">
                                  <span>Slot Sesi #{slotNum} (Kosong)</span>
                                  <button
                                    type="button"
                                    disabled={sessionBusy}
                                    onClick={() => handleManageDOSession('create', slotNum)}
                                    className="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-2.5 py-0.5 rounded text-[10px] transition"
                                  >
                                    {sessionBusy ? "..." : "+ Jana Sesi 6 Jam"}
                                  </button>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>

                      <p className="text-[10px] text-slate-400 leading-relaxed pt-1">
                        Setiap sesi mempunyai ruang simpanan tersendiri dan akan <strong>tamat tempoh secara automatik selepas 6 jam</strong>.
                      </p>
                    </div>

                    <div className="flex justify-end pt-1">
                      <button

                        >
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                          <span>Salin Pautan Kolaborasi (Bersama Program Terpilih)</span>
                        </button>
                      </div>
                      <p className="text-[10px] text-slate-400 leading-relaxed">
                        Kongsikan passkey ini kepada pembantu di talian Wi-Fi sepunya. Pembantu boleh mengisi matriks, modul & ulasan <strong>kecuali</strong> menambah/menukar program NOSS.
                      </p>
                    </div>

                    <div className="flex items-center justify-between pt-2 border-t">
                      <button
                        type="button"
                        onClick={handleLogoutAccess}
                        className="text-xs text-rose-600 hover:text-rose-800 font-semibold"
                      >
                        Kunci Semula (Log Keluar)
                      </button>
                      <button
                        type="button"
                        onClick={() => setShowPasskeyModal(false)}
                        className="px-4 py-1.5 text-xs font-bold text-white bg-slate-800 hover:bg-slate-700 rounded"
                      >
                        Selesai
                      </button>
                    </div>
                  </div>
                ) : (
                  /* BORANG PENGESAHAN UNTUK DO ATAU PEMBANTU */
                  <div className="space-y-3 text-xs">
                    {userRole === "PEMBANTU" && (
                      <div className="p-2.5 bg-emerald-50 border border-emerald-300 rounded-lg flex items-center justify-between">
                        <div>
                          <span className="font-bold text-emerald-900 block">👥 Mod Pembantu (Kolaborasi Aktif)</span>
                          <span className="text-[10px] text-emerald-700">Boleh sunting pemetaan, modul & ulasan (Program NOSS dikunci).</span>
                        </div>
                        <button
                          type="button"
                          onClick={handleLogoutAccess}
                          className="text-[11px] text-rose-600 hover:underline font-semibold shrink-0 ml-2"
                        >
                          Kunci
                        </button>
                      </div>
                    )}

                    {/* TABS PILIHAN PENGESAHAN */}
                    <div className="grid grid-cols-2 gap-1 bg-slate-100 p-1 rounded-lg">
                      <button
                        type="button"
                        onClick={() => { setAuthTabMode("PEMBANTU"); setPasskeyError(""); }}
                        className={`py-1.5 rounded-md font-bold text-[11px] transition ${authTabMode === "PEMBANTU" ? "bg-white text-indigo-700 shadow-xs" : "text-slate-600 hover:text-slate-900"}`}
                      >
                        👥 Passkey Pembantu
                      </button>
                      <button
                        type="button"
                        onClick={() => { setAuthTabMode("DO"); setPasskeyError(""); }}
                        className={`py-1.5 rounded-md font-bold text-[11px] transition ${authTabMode === "DO" ? "bg-white text-amber-800 shadow-xs" : "text-slate-600 hover:text-slate-900"}`}
                      >
                        👑 Log Masuk Pegawai DO
                      </button>
                    </div>

                    {authTabMode === "PEMBANTU" ? (
                      <form onSubmit={handleVerifyCollaboratorPasskey} className="space-y-3 pt-1">
                        <div>
                          <label className="block font-semibold text-slate-700 mb-1">Masukkan Passkey Kolaborasi (Daripada DO):</label>
                          <input
                            type="text"
                            value={inputPasskey}
                            onChange={(e) => setInputPasskey(e.target.value)}
                            placeholder="Contoh: JPK-4821"
                            className="w-full p-2 border border-slate-300 rounded focus:ring-1 focus:ring-indigo-500 font-mono text-center uppercase tracking-widest text-sm"
                            autoFocus
                            required
                          />
                          <p className="text-[10px] text-slate-500 mt-1">
                            Dapatkan kod passkey harian yang dijana oleh pegawai DO untuk menyunting matriks secara kolaboratif.
                          </p>
                        </div>

                        {passkeyError && (
                          <p className="text-[11px] text-rose-600 font-semibold bg-rose-50 p-2 rounded border border-rose-200">{passkeyError}</p>
                        )}

                        <div className="flex justify-end gap-2 pt-2 border-t">
                          <button type="button" onClick={() => setShowPasskeyModal(false)} className="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded">Tutup</button>
                          <button type="submit" disabled={authLoading} className="px-4 py-1.5 text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded shadow">
                            {authLoading ? "Menyemak..." : "Aktifkan Kolaborasi"}
                          </button>
                        </div>
                      </form>
                    ) : (
                      <div className="space-y-4 pt-1">
                        {/* PENGESAHAN IDENTITI RASMI GOOGLE (OAUTH SAHAJA - TIADA INPUT MANUAL) */}
                        <div className="p-4 bg-slate-50 border border-slate-200 rounded-xl text-center space-y-3">
                          <div className="w-12 h-12 bg-amber-100 text-amber-700 rounded-full flex items-center justify-center mx-auto shadow-inner">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                            </svg>
                          </div>

                          <div>
                            <h4 className="font-bold text-slate-800 text-sm">Log Masuk Rasmi Pegawai DO</h4>
                            <p className="text-[11px] text-slate-500 mt-1 leading-relaxed">
                              Sila log masuk menggunakan <strong>Akaun Google</strong> rasmi anda. Sistem akan mengesahkan identiti anda terus melalui Google dan menyemak status aktif dalam helaian <strong>Tab DO</strong>.
                            </p>
                          </div>

                          <div className="pt-1">
                            <button
                              type="button"
                              onClick={handleGoogleSignInClick}
                              disabled={authLoading}
                              className="w-full bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 shadow-sm font-semibold py-2.5 px-4 rounded-lg flex items-center justify-center gap-2.5 transition active:scale-[0.99]"
                            >
                              {authLoading ? (
                                <span className="flex items-center gap-2 text-xs text-amber-700">
                                  <svg className="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                                  Mengesahkan Akaun Google...
                                </span>
                              ) : (
                                <>
                                  <svg className="w-4 h-4" viewBox="0 0 24 24">
                                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                                  </svg>
                                  <span className="text-xs">Log Masuk dengan Google</span>
                                </>
                              )}
                            </button>
                          </div>

                          <div className="text-[10px] text-slate-400 bg-slate-100/80 p-2 rounded border border-slate-200/60 text-left space-y-0.5">
                            <span className="font-semibold text-slate-600 block">🔒 Kawalan Akses Ketat:</span>
                            <span>Hanya pegawai yang akaun Google-nya aktif dan tersenarai di <strong>Tab DO</strong> akan diberikan akses pentadbir. Input manual telah dimatikan sepenuhnya.</span>
                          </div>
                        </div>

                        {passkeyError && (
                          <div className="text-[11px] text-rose-700 font-semibold bg-rose-50 p-2.5 rounded-lg border border-rose-200 flex items-start gap-1.5">
                            <span className="text-rose-500 font-bold">⚠</span>
                            <span>{passkeyError}</span>
                          </div>
                        )}

                        <div className="flex justify-end pt-2 border-t">
                          <button type="button" onClick={() => setShowPasskeyModal(false)} className="px-4 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded">Tutup</button>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL TAMBAH MODUL MANUAL */}
          {showAddModuleModal && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 no-print">
              <form onSubmit={handleSaveNewModule} className="bg-white rounded-xl shadow-xl max-w-md w-full p-5 space-y-4">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-slate-800 text-sm">Tambah Modul Kurikulum Agensi</h3>
                  <button type="button" onClick={() => setShowAddModuleModal(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Kod Modul</label>
                    <input
                      type="text"
                      value={newModCode}
                      onChange={(e) => setNewModCode(e.target.value)}
                      placeholder="Contoh: M1"
                      className="w-full p-2 border border-slate-300 rounded focus:ring-1 focus:ring-indigo-500 font-mono"
                      required
                    />
                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Nama / Tajuk Modul</label>
                    <input
                      type="text"
                      value={newModTitle}
                      onChange={(e) => setNewModTitle(e.target.value)}
                      placeholder="Masukkan tajuk modul agensi..."
                      className="w-full p-2 border border-slate-300 rounded focus:ring-1 focus:ring-indigo-500"
                      autoFocus
                      required
                    />
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button type="button" onClick={() => setShowAddModuleModal(false)} className="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded">Batal</button>
                  <button type="submit" className="px-4 py-1.5 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded shadow">Simpan Modul</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL TAMBAH SUBMODUL MANUAL */}
          {showAddSubModal && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 no-print">
              <form onSubmit={handleSaveNewSubModule} className="bg-white rounded-xl shadow-xl max-w-lg w-full p-5 space-y-4">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-slate-800 text-sm">Tambah Sub-Modul / Topik Agensi</h3>
                  <button type="button" onClick={() => setShowAddSubModal(null)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div className="space-y-3 text-xs">
                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Kod SubModul</label>
                      <input
                        type="text"
                        value={newSubCode}
                        onChange={(e) => setNewSubCode(e.target.value)}
                        placeholder="SS01"
                        className="w-full p-2 border border-slate-300 rounded focus:ring-1 focus:ring-indigo-500 font-mono"
                        required
                      />
                    </div>
                    <div className="col-span-2">
                      <label className="block font-semibold text-slate-700 mb-1">Nama Topik / Sub-Modul</label>
                      <input
                        type="text"
                        value={newSubName}
                        onChange={(e) => setNewSubName(e.target.value)}
                        placeholder="Masukkan nama topik atau sub-modul..."
                        className="w-full p-2 border border-slate-300 rounded focus:ring-1 focus:ring-indigo-500"
                        autoFocus
                        required
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-4 gap-3">
                    <div className="col-span-3">
                      <label className="block font-semibold text-slate-700 mb-1">Knowledge / Kandungan Teori (Pilihan)</label>
                      <input
                        type="text"
                        value={newSubKnowledge}
                        onChange={(e) => setNewSubKnowledge(e.target.value)}
                        placeholder="Ringkasan teori yang diajar..."
                        className="w-full p-2 border border-slate-300 rounded focus:ring-1 focus:ring-indigo-500"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Jam Teori</label>
                      <input
                        type="number"
                        min="0"
                        value={newSubRkHours}
                        onChange={(e) => setNewSubRkHours(e.target.value)}
                        className="w-full p-2 border border-slate-300 rounded focus:ring-1 focus:ring-indigo-500 font-mono"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-4 gap-3">
                    <div className="col-span-3">
                      <label className="block font-semibold text-slate-700 mb-1">Applied Skills / Amali (Pilihan)</label>
                      <input
                        type="text"
                        value={newSubSkills}
                        onChange={(e) => setNewSubSkills(e.target.value)}
                        placeholder="Ringkasan kemahiran praktikal..."
                        className="w-full p-2 border border-slate-300 rounded focus:ring-1 focus:ring-indigo-500"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Jam Amali</label>
                      <input
                        type="number"
                        min="0"
                        value={newSubRsHours}
                        onChange={(e) => setNewSubRsHours(e.target.value)}
                        className="w-full p-2 border border-slate-300 rounded focus:ring-1 focus:ring-indigo-500 font-mono"
                      />
                    </div>
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button type="button" onClick={() => setShowAddSubModal(null)} className="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded">Batal</button>
                  <button type="submit" className="px-4 py-1.5 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded shadow">Simpan Sub-Modul</button>
                </div>
              </form>
            </div>
          )}

          <footer className="bg-white border-t border-slate-200 py-2 text-center text-[11px] text-slate-400 no-print">
            Sistem Pemetaan Kurikulum & NOSS Bersepadu © 2026
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
