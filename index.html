<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Pemetaan Kurikulum & SKPK (NOSS)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- SheetJS (xlsx) for Excel processing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    /* PRINT OPTIMIZATION (Fit landscape, no cutoff, 2 columns for Ya/Tidak) */
    @page {
      size: A4 landscape;
      margin: 8mm 6mm;
    }
    @media print {
      body {
        background: white !important;
        color: black !important;
        font-size: 8pt !important;
        line-height: 1.15 !important;
      }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .print-table {
        width: 100% !important;
        max-width: 100% !important;
        table-layout: auto !important;
        border-collapse: collapse !important;
        border: 1px solid #1e293b !important;
      }
      .print-table th, .print-table td {
        border: 1px solid #334155 !important;
        padding: 3px 4px !important;
        font-size: 7.5pt !important;
        word-break: break-word !important;
      }
      .page-break { page-break-after: always; }
      .sticky-col-1, .sticky-col-2, .sticky-col-3, .sticky-header { position: static !important; }
      .print-show-col { display: table-cell !important; }
      .print-hide-col { display: none !important; }
      /* Ensure editable inputs look like plain text in print */
      input, textarea, select {
        border: none !important;
        background: transparent !important;
        padding: 0 !important;
        resize: none !important;
        width: 100% !important;
        font-size: 7.5pt !important;
      }
    }
    .print-only { display: none; }
    .print-show-col { display: none; }

    /* Fixed Table Layout for exact freeze panes alignment */
    .table-fixed-matrix {
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 0;
    }

    /* Column Widths */
    .col-no { width: 46px; min-width: 46px; max-width: 46px; }
    .col-modul { width: 280px; min-width: 280px; max-width: 280px; }
    .col-action { width: 44px; min-width: 44px; max-width: 44px; }
    .col-wa { width: 40px; min-width: 40px; max-width: 40px; }
    .col-wa-collapsed { width: 50px; min-width: 50px; max-width: 50px; }

    /* Sticky Positions Left */
    .sticky-c1 { position: sticky; left: 0px; z-index: 20; }
    .sticky-c2 { position: sticky; left: 46px; z-index: 20; }
    .sticky-c3 { position: sticky; left: 326px; z-index: 20; }

    /* Vertical Text Rotation for WA Headers */
    .wa-vertical-title {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
      text-orientation: mixed;
      height: 110px;
      max-height: 110px;
      margin: 0 auto;
      text-align: left;
      font-size: 10px;
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Scroll styling */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // --- DATASET SKPK (NOSS) ---
    const NOSS_DATASETS = {
      "MC-024-4:2012": {
        code: "MC-024-4:2012",
        title: "PENGURUSAN TEKNOLOGI KIMPALAN",
        tahap: "4",
        cus: [
          {
            id: "CU1",
            code: "MC-024-4:2012-C01",
            title: "WELDING PROCEDURE SPECIFICATION (WPS) & PQR DEVELOPMENT",
            was: [
              { id: "WA1", code: "C01-W01", title: "Review welding procedure specification requirements.", rk: "Welding codes, ASME IX, AWS D1.1, WPS/PQR variables.", rkHours: 25, rs: "Inspect joint design and base metal specifications.", rsHours: 55 },
              { id: "WA2", code: "C01-W02", title: "Prepare welder qualification test coupon.", rk: "Welder qualification testing criteria & certification rules.", rkHours: 30, rs: "Prepare welder test coupon identification tags.", rsHours: 65 },
              { id: "WA3", code: "C01-W03", title: "Supervise welding testing activities.", rk: "Destructive & Non-Destructive Testing (NDT) procedures.", rkHours: 40, rs: "Monitor coupon welding, arrange lab tensile/bend tests.", rsHours: 90 }
            ]
          },
          {
            id: "CU2",
            code: "MC-024-4:2012-C02",
            title: "WELDING INSPECTION & QUALITY ASSURANCE IMPLEMENTATION",
            was: [
              { id: "WA1", code: "C02-W01", title: "Establish Inspection & Test Plan (ITP).", rk: "Quality assurance concepts, ISO 3834, ITP hold points.", rkHours: 20, rs: "Draft ITP matrix, determine third-party inspection stages.", rsHours: 60 },
              { id: "WA2", code: "C02-W02", title: "Conduct visual inspection on welded joints.", rk: "Visual inspection criteria (AWS D1.1 / ASME V), weld defects.", rkHours: 25, rs: "Use bridge cam gauge, weld fillet gauge, record undercut.", rsHours: 70 },
              { id: "WA3", code: "C02-W03", title: "Evaluate Non-Destructive Testing (NDT) reports.", rk: "RT, UT, MT, PT principles, acceptance criteria.", rkHours: 35, rs: "Review radiography films, cross-check UT flaw sizing.", rsHours: 80 }
            ]
          },
          {
            id: "CU3",
            code: "MC-024-4:2012-C03",
            title: "WELDING PRODUCTION PLANNING & CONTROL",
            was: [
              { id: "WA1", code: "C03-W01", title: "Estimate welding consumable requirements.", rk: "Deposition efficiency, filler wire formulas, gas flow rates.", rkHours: 25, rs: "Calculate required weld metal weight, plan electrode baking.", rsHours: 50 },
              { id: "WA2", code: "C03-W02", title: "Formulate welding schedule and resource allocation.", rk: "Gantt charts, welder productivity rates, sequence control.", rkHours: 30, rs: "Plot project timelines, assign qualified welders.", rsHours: 60 }
            ]
          }
        ]
      },
      "G452-002-2:2018": {
        code: "G452-002-2:2018",
        title: "AFTER SALES - SERVICING",
        tahap: "2",
        cus: [
          {
            id: "CU1",
            code: "G452-002-2:2018-C01",
            title: "WORKSHOP HOUSEKEEPING & 5S COMPLIANCE",
            was: [
              { id: "WA1", code: "C01-W01", title: "Identify workshop housekeeping requirements.", rk: "Safety rules, OSHA compliance, 5S standards.", rkHours: 15, rs: "Perform pre-inspection of workshop layout.", rsHours: 40 },
              { id: "WA2", code: "C01-W02", title: "Prepare workshop housekeeping setup.", rk: "Cleaning chemicals, waste material disposal.", rkHours: 20, rs: "Prepare cleaning tools, segregate toxic waste.", rsHours: 50 }
            ]
          }
        ]
      }
    };

    // --- DATASET LALAI AGENSI ---
    const INITIAL_MODULES = [
      {
        id: "MOD-1",
        code: "M1",
        title: "Pengurusan Dokumentasi & Kualiti Kimpalan",
        subModules: [
          {
            subId: "SM-1",
            code: "SS01",
            name: "Kajian Kod, Standard & Penyediaan WPS/PQR",
            matchedWAs: ["CU1-WA1", "CU1-WA2"],
            knowledge: "Standard ASME IX & AWS D1.1, Borang WPS, Parameter Arus.",
            rkHours: 20,
            skills: "Merangka draf WPS bagi kimpalan paip 6G, melaras mesin MIG.",
            rsHours: 60
          },
          {
            subId: "SM-2",
            code: "SS02",
            name: "Perancangan Pelan Pemeriksaan & Ujian (ITP)",
            matchedWAs: ["CU1-WA3", "CU2-WA1"],
            knowledge: "Format ITP, Penentuan Hold Point pihak ketiga.",
            rkHours: 20,
            skills: "Membangunkan jadual matriks ITP tangki tekanan tinggi.",
            rsHours: 50
          }
        ]
      },
      {
        id: "MOD-2",
        code: "M2",
        title: "Pengurusan Bahan, Bahan Luak & Pembakar",
        subModules: [
          {
            subId: "SM-3",
            code: "SS03",
            name: "Pengiraan Keperluan Elektrod & Gas Pelindung",
            matchedWAs: ["CU3-WA1"],
            knowledge: "Formula volum deposit kimpalan sudut & alur, faktor kehilangan.",
            rkHours: 25,
            skills: "Mengira kuantiti elektrod E7018 dan gas Argon struktur 50 tan.",
            rsHours: 45
          },
          {
            subId: "SM-4",
            code: "SS04",
            name: "Penyimpanan & Pengendalian Ketuhar Elektrod (Baking Oven)",
            matchedWAs: ["CU1-WA2", "CU3-WA1"],
            knowledge: "Suhu baking (350°C) & holding oven (150°C), hidrogen resapan.",
            rkHours: 15,
            skills: "Mengisi rekod log suhu oven elektrod tapak bina.",
            rsHours: 35
          }
        ]
      },
      {
        id: "MOD-3",
        code: "M3",
        title: "Pemeriksaan Visual & Penilaian NDT",
        subModules: [
          {
            subId: "SM-5",
            code: "SS05",
            name: "Pemeriksaan Visual Sambungan Kimpal & Cacat",
            matchedWAs: ["CU2-WA2"],
            knowledge: "Piawaian had terima kecacatan kimpalan AWS D1.1.",
            rkHours: 25,
            skills: "Mengukur ketinggian tetulang kimpalan dengan Bridge Cam Gauge.",
            rsHours: 65
          }
        ]
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState("tab1"); // "tab1" = Matriks Standard | "tab2" = Padanan Kandungan
      const [currentNossCode, setCurrentNossCode] = useState("MC-024-4:2012");
      const [modules, setModules] = useState(INITIAL_MODULES);
      const [collapsedCUs, setCollapsedCUs] = useState({});
      const [collapsedModules, setCollapsedModules] = useState({});
      
      const [showFullWA, setShowFullWA] = useState(true);
      const [showSubModules, setShowSubModules] = useState(true);
      const [focusMode, setFocusMode] = useState(false);
      const [hoveredWA, setHoveredWA] = useState(null);

      // State khusus untuk pengubahsuaian status manual di Tab 2 (Manual Override: "YA" | "TIDAK")
      const [manualCompliance, setManualCompliance] = useState({});
      // State catatan jurang (GAP) boleh disunting terus
      const [gapRemarks, setGapRemarks] = useState({});

      const [committeeRemarks, setCommitteeRemarks] = useState({
        CU1: "Semua ceraian WA dipenuhi dengan baik mengikut piawaian.",
        CU2: "Perlu penambahan jam amali bagi WA3 (NDT evaluation).",
        CU3: "Modul memenuhi keperluan asas perancangan bahan kimpalan."
      });

      const currentNoss = NOSS_DATASETS[currentNossCode] || NOSS_DATASETS["MC-024-4:2012"];

      // Total WA in current NOSS
      const totalProgramWA = useMemo(() => {
        return currentNoss.cus.reduce((acc, c) => acc + c.was.length, 0);
      }, [currentNoss]);

      // Covered WAs set from mapping
      const coveredWAIds = useMemo(() => {
        const set = new Set();
        modules.forEach(m => {
          m.subModules.forEach(sm => {
            (sm.matchedWAs || []).forEach(wId => set.add(wId));
          });
        });
        return set;
      }, [modules]);

      // CU Statistics & Coverage Count
      const cuStats = useMemo(() => {
        const stats = {};
        currentNoss.cus.forEach(cu => {
          const totalWA = cu.was.length;
          const metWA = cu.was.filter(wa => coveredWAIds.has(`${cu.id}-${wa.id}`)).length;
          const pct = totalWA > 0 ? Math.round((metWA / totalWA) * 100) : 0;
          const missingWAs = cu.was.filter(wa => !coveredWAIds.has(`${cu.id}-${wa.id}`));
          stats[cu.id] = { totalWA, metWA, pct, missingWAs, hasAnyCoverage: metWA > 0 };
        });
        return stats;
      }, [currentNoss, coveredWAIds]);

      // Modul Coverage check (Modul Induk & Submodul) + Modul % Coverage
      const moduleStats = useMemo(() => {
        const stats = {};
        modules.forEach(m => {
          const modUniqueWAs = new Set();
          m.subModules.forEach(sm => {
            (sm.matchedWAs || []).forEach(w => modUniqueWAs.add(w));
          });
          const countMet = modUniqueWAs.size;
          const pct = totalProgramWA > 0 ? Math.round((countMet / totalProgramWA) * 100) : 0;
          stats[m.id] = {
            hasAny: countMet > 0,
            countMet,
            pct
          };
        });
        return stats;
      }, [modules, totalProgramWA]);

      // Toggle Matrix Tick 'X'
      const toggleMatch = (subId, globalWaId) => {
        setModules(prev => prev.map(m => ({
          ...m,
          subModules: m.subModules.map(sm => {
            if (sm.subId !== subId) return sm;
            const current = sm.matchedWAs || [];
            const exists = current.includes(globalWaId);
            const updated = exists ? current.filter(id => id !== globalWaId) : [...current, globalWaId];
            return { ...sm, matchedWAs: updated };
          })
        })));
      };

      const toggleCUCollapse = (cuId) => {
        setCollapsedCUs(prev => ({ ...prev, [cuId]: !prev[cuId] }));
      };

      const handleToggleSubModules = () => {
        const next = !showSubModules;
        setShowSubModules(next);
        const newMap = {};
        modules.forEach(m => { newMap[m.id] = !next; });
        setCollapsedModules(newMap);
      };

      const deleteSubModule = (modId, subId) => {
        if (!confirm("Adakah anda pasti untuk memadam Sub Modul ini?")) return;
        setModules(prev => prev.map(m => {
          if (m.id !== modId) return m;
          return { ...m, subModules: m.subModules.filter(sm => sm.subId !== subId) };
        }));
      };

      // Suntingan langsung modul di Tab 2
      const handleUpdateSubModuleField = (modId, subId, field, value) => {
        setModules(prev => prev.map(m => {
          if (m.id !== modId) return m;
          return {
            ...m,
            subModules: m.subModules.map(sm => {
              if (sm.subId !== subId) return sm;
              return { ...sm, [field]: value };
            })
          };
        }));
      };

      // Toggle Status Memenuhi di Tab 2
      const toggleComplianceStatus = (gId, defaultStatus) => {
        const current = manualCompliance[gId] !== undefined ? manualCompliance[gId] : defaultStatus;
        setManualCompliance({
          ...manualCompliance,
          [gId]: !current
        });
      };

      // Dynamic Sticky Top Offsets (Fixing Header Disconnect when Hiding WA Titles)
      const r2Top = showFullWA ? "top-[125px]" : "top-[36px]";
      const r3Top = showFullWA ? "top-[165px]" : "top-[76px]";

      // File upload handler
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            
            const sheet1Name = workbook.SheetNames.find(n => n.toLowerCase().includes("modul")) || workbook.SheetNames[0];
            const rows1 = XLSX.utils.sheet_to_json(workbook.Sheets[sheet1Name]);
            
            let subTopicMap = {};
            const sheet2Name = workbook.SheetNames.find(n => n.toLowerCase().includes("subtopic"));
            if (sheet2Name) {
              const rows2 = XLSX.utils.sheet_to_json(workbook.Sheets[sheet2Name]);
              rows2.forEach(r => {
                const sCode = String(r["Kod Sub Modul"] || "").trim();
                if (sCode) {
                  subTopicMap[sCode] = {
                    knowledge: r["Knowledge / Sub Topic"] || "",
                    rkHours: Number(r["Training Duration (Knowledge)"] || 0),
                    skills: r["Applied Skills / Sub Topic"] || "",
                    rsHours: Number(r["Training Duration (Applied Skills)"] || 0)
                  };
                }
              });
            }

            const newModulesMap = {};
            rows1.forEach((r, idx) => {
              const modCode = String(r["Kod Modul"] || `M${idx+1}`).trim();
              const modTitle = String(r["Nama Modul"] || "Modul Agensi").trim();
              const subCode = String(r["Kod Sub Modul"] || `SS0${idx+1}`).trim();
              const subName = String(r["Topik / Sub Modul / Elemen"] || `Topik ${idx+1}`).trim();
              
              const waCol = r["Padanan Kod WA NOSS (Pilihan / Optional)"] || r["Padanan Kod WA NOSS"] || "";
              const matchedList = String(waCol).split(",").map(s => s.trim()).filter(Boolean);

              if (!newModulesMap[modCode]) {
                newModulesMap[modCode] = {
                  id: `MOD-${modCode}`,
                  code: modCode,
                  title: modTitle,
                  subModules: []
                };
              }

              const stDetails = subTopicMap[subCode] || {};
              newModulesMap[modCode].subModules.push({
                subId: `SM-${subCode}-${idx}`,
                code: subCode,
                name: subName,
                matchedWAs: matchedList,
                knowledge: stDetails.knowledge || `Perincian teori ${subName}`,
                rkHours: stDetails.rkHours || 20,
                skills: stDetails.skills || `Perincian kemahiran amali ${subName}`,
                rsHours: stDetails.rsHours || 40
              });
            });

            const finalMods = Object.values(newModulesMap);
            if (finalMods.length > 0) {
              setModules(finalMods);
              alert("Data Excel berjaya dimuat naik dan dipadankan!");
            }
          } catch (err) {
            alert("Ralat semasa membaca fail Excel: " + err.message);
          }
        };
        reader.readAsArrayBuffer(file);
      };

      return (
        <div className="flex flex-col min-h-screen">
          
          {/* HEADER UTAMA */}
          {!focusMode && (
            <header className="bg-slate-900 text-white shadow-md border-b border-slate-800 no-print">
              <div className="max-w-7xl mx-auto px-4 py-2 flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center space-x-2.5">
                  <div className="p-1.5 bg-indigo-600 rounded-lg text-white shadow">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                  </div>
                  <div>
                    <h1 className="text-base font-bold tracking-tight text-white">Sistem Pemetaan Kurikulum & SKPK (NOSS)</h1>
                  </div>
                </div>

                <div className="flex items-center flex-wrap gap-2 text-xs">
                  {/* SELECTOR NOSS */}
                  <div className="bg-slate-800 border border-slate-700 px-2 py-1 rounded-lg flex items-center gap-1.5">
                    <span className="text-amber-400 font-bold text-[11px]">NOSS:</span>
                    <select
                      value={currentNossCode}
                      onChange={(e) => setCurrentNossCode(e.target.value)}
                      className="bg-slate-900 text-slate-100 font-mono text-xs rounded border-none focus:ring-1 focus:ring-indigo-400 py-0.5 px-1.5 cursor-pointer"
                    >
                      <option value="MC-024-4:2012">MC-024-4:2012 (Kimpalan T4)</option>
                      <option value="G452-002-2:2018">G452-002-2:2018 (Automotif T2)</option>
                    </select>
                  </div>

                  {/* Templat Excel Drive */}
                  <a 
                    href="https://drive.google.com/uc?export=download&id=1x1nbVWYK3QXnS90mveWHFHiMjBsGhv9T"
                    target="_blank"
                    rel="noopener noreferrer"
                    className="flex items-center gap-1 bg-emerald-700 hover:bg-emerald-600 text-white font-medium px-2.5 py-1.5 rounded-lg shadow text-xs transition"
                    title="Muat turun Templat Map Agensi dari Google Drive"
                  >
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    Templat Excel
                  </a>

                  {/* Cetak Rasmi */}
                  <button 
                    onClick={() => window.print()}
                    className="flex items-center gap-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-2.5 py-1.5 rounded-lg shadow text-xs transition"
                  >
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
                    Cetak Rasmi
                  </button>
                </div>
              </div>
            </header>
          )}

          {/* BAR SEBARIS: NAMA TAB + 3 BUTANG KAWALAN */}
          <div className="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30 no-print">
            <div className="max-w-7xl mx-auto px-4 flex flex-wrap items-center justify-between gap-2 py-1.5">
              
              <div className="flex space-x-1">
                <button
                  onClick={() => setActiveTab("tab1")}
                  className={`flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold rounded-lg transition ${activeTab === 'tab1' ? 'bg-indigo-50 text-indigo-700 border border-indigo-200 shadow-sm' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}`}
                >
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                  Tab 1: Matriks Standard
                </button>
                <button
                  onClick={() => setActiveTab("tab2")}
                  className={`flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold rounded-lg transition ${activeTab === 'tab2' ? 'bg-indigo-50 text-indigo-700 border border-indigo-200 shadow-sm' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}`}
                >
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>

                    <h2 className="font-bold text-xs uppercase tracking-wide flex items-center gap-2">
                      <svg className="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                      JADUAL RINGKASAN PEMENUHAN WA & TEMPOH LATIHAN (BORANG JPK 04-A)
                    </h2>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse text-xs print-table">
                      <thead className="bg-slate-100 text-slate-700 border-b border-slate-300 font-bold">
                        <tr>
                          <th rowSpan="2" className="p-1.5 border-r border-slate-300 text-center w-12">CU</th>
                          <th rowSpan="2" className="p-1.5 border-r border-slate-300 text-center w-16">BIL WA (A)</th>
                          <th rowSpan="2" className="p-1.5 border-r border-slate-300 text-center w-20">DIPENUHI (B)</th>
                          <th rowSpan="2" className="p-1.5 border-r border-slate-300 text-center w-16">% DIPENUHI</th>
                          <th rowSpan="2" className="p-1.5 border-r border-slate-300 text-center w-28">WA TIDAK DIPENUHI</th>
                          <th colSpan="2" className="p-1 border-r border-slate-300 text-center bg-slate-200">SKPK (JAM)</th>
                          <th colSpan="2" className="p-1 border-r border-slate-300 text-center bg-indigo-50">AGENSI (JAM)</th>
                          <th rowSpan="2" className="p-1.5 border-slate-300 text-left min-w-[160px]">CADANGAN JAWATANKUASA</th>
                        </tr>
                        <tr className="bg-slate-50 text-[10px]">
                          <th className="p-1 border-r border-slate-300 text-center bg-slate-100">Teori</th>
                          <th className="p-1 border-r border-slate-300 text-center bg-slate-100">Amali</th>
                          <th className="p-1 border-r border-slate-300 text-center bg-indigo-50/70">Teori</th>
                          <th className="p-1 border-r border-slate-300 text-center bg-indigo-50/70">Amali</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        {currentNoss.cus.map(cu => {
                          const st = cuStats[cu.id];
                          const nossRkH = cu.was.reduce((a, b) => a + b.rkHours, 0);
                          const nossRsH = cu.was.reduce((a, b) => a + b.rsHours, 0);
                          
                          let agensiRkH = 0;
                          let agensiRsH = 0;
                          modules.forEach(m => {
                            m.subModules.forEach(sm => {
                              const matchesInCU = (sm.matchedWAs || []).filter(w => w.startsWith(cu.id));
                              if (matchesInCU.length > 0) {
                                agensiRkH += Number(sm.rkHours) || 0;
                                agensiRsH += Number(sm.rsHours) || 0;
                              }
                            });
                          });

                          return (
                            <tr key={cu.id} className="hover:bg-slate-50">
                              <td className="p-1.5 border-r border-slate-200 text-center font-bold text-slate-800">{cu.id}</td>
                              <td className="p-1.5 border-r border-slate-200 text-center font-mono">{st.totalWA}</td>
                              <td className="p-1.5 border-r border-slate-200 text-center font-mono font-semibold text-teal-800">{st.metWA}</td>
                              <td className="p-1.5 border-r border-slate-200 text-center font-mono font-bold">
                                <span className={`px-1.5 py-0.2 rounded ${st.pct === 100 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                  {st.pct}%
                                </span>
                              </td>
                              <td className="p-1.5 border-r border-slate-200 text-center">
                                {st.missingWAs.length === 0 ? (
                                  <span className="text-emerald-700 font-semibold text-[11px]">✓ Lengkap</span>
                                ) : (
                                  <div className="flex flex-wrap gap-1 justify-center">
                                    {st.missingWAs.map(w => (
                                      <span key={w.id} className="bg-rose-100 text-rose-700 px-1 rounded text-[10px] font-mono">{w.id}</span>
                                    ))}
                                  </div>
                                )}
                              </td>
                              <td className="p-1.5 border-r border-slate-200 text-center font-mono text-slate-600">{nossRkH}j</td>
                              <td className="p-1.5 border-r border-slate-200 text-center font-mono text-slate-600">{nossRsH}j</td>
                              <td className="p-1.5 border-r border-slate-200 text-center font-mono text-indigo-700 font-semibold">{agensiRkH}j</td>
                              <td className="p-1.5 border-r border-slate-200 text-center font-mono text-indigo-700 font-semibold">{agensiRsH}j</td>
                              <td className="p-1 border-slate-200">
                                <textarea
                                  value={committeeRemarks[cu.id] || ""}
                                  onChange={(e) => setCommitteeRemarks({ ...committeeRemarks, [cu.id]: e.target.value })}
                                  placeholder="Ulasan cadangan jawatankuasa..."
                                  rows="1"
                                  className="w-full text-xs p-1 border border-slate-200 rounded focus:ring-1 focus:ring-indigo-500"
                                />
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* BORANG COCU JPK 03: BUTIRAN BOLEH DIPINDA + STATUS MEMENUHI INTERAKTIF */}
                <div className="space-y-3">
                  <div className="flex items-center justify-between no-print">
                    <span className="text-xs text-slate-500 font-medium">
                      ✏️ <strong>Petua Tab 2:</strong> Butiran Modul Agensi (Teori, Amali, Jam) dan Catatan GAP boleh dipinda terus pada borang. Klik butang status untuk togol Memenuhi/Tidak.
                    </span>
                  </div>

                  {currentNoss.cus.map(cu => {
                    const st = cuStats[cu.id];
                    return (
                      <div key={cu.id} className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                        
                        <div className="bg-slate-50 border-b border-slate-200 p-2.5 flex flex-wrap items-center justify-between gap-2">
                          <div className="flex items-center gap-2">
                            <span className="bg-teal-700 text-white font-bold px-2 py-0.5 rounded text-xs font-mono">{cu.id}</span>
                            <span className="font-bold text-slate-800 text-xs md:text-sm">{cu.title}</span>
                          </div>
                          <span className={`text-xs px-2 py-0.5 rounded-full font-bold ${st.pct === 100 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                            {st.metWA}/{st.totalWA} WA Dipenuhi ({st.pct}%)
                          </span>
                        </div>

                        <div className="overflow-x-auto">
                          <table className="w-full text-left border-collapse text-xs print-table">
                            <thead className="bg-slate-100 text-slate-700 border-b border-slate-300 font-bold">
                              <tr>
                                <th colSpan="3" className="p-1.5 border-r border-slate-300 text-center bg-slate-200 text-slate-800 uppercase">
                                  COCU / TASK PROFILE (SKPK)
                                </th>
                                <th colSpan="5" className="p-1.5 border-r border-slate-300 text-center bg-indigo-100 text-indigo-900 uppercase">
                                  KURIKULUM PROGRAM AGENSI
                                </th>
                                
                                {/* UI Skrin: 1 Kolum Sahaja (MEMENUHI) */}
                                <th className="p-1.5 border-r border-slate-300 text-center bg-slate-200 w-24 no-print">
                                  MEMENUHI
                                </th>

                                {/* Print Mode: 2 Kolum (Ya / Tidak) */}
                                <th colSpan="2" className="p-1.5 border-r border-slate-300 text-center bg-slate-200 w-20 print-show-col">
                                  MEMENUHI
                                </th>

                                <th rowSpan="2" className="p-1.5 text-left min-w-[130px]">CATATAN (GAP)</th>
                              </tr>

                              <tr className="bg-slate-50 text-[10px]">
                                <th className="p-1 border-r border-slate-300 w-16 text-center">WA</th>
                                <th className="p-1 border-r border-slate-300 min-w-[140px]">Related Knowledge</th>
                                <th className="p-1 border-r border-slate-300 min-w-[140px]">Applied Skills</th>

                                <th className="p-1 border-r border-slate-300 w-24">Module Agensi</th>
                                <th className="p-1 border-r border-slate-300 min-w-[140px]">Knowledge / Sub Topic</th>
                                <th className="p-1 border-r border-slate-300 w-12 text-center">Jam</th>
                                <th className="p-1 border-r border-slate-300 min-w-[140px]">Applied Skills</th>
                                <th className="p-1 border-r border-slate-300 w-12 text-center">Jam</th>

                                {/* UI Subheader */}
                                <th className="p-1 border-r border-slate-300 text-center w-24 no-print">Status (Klik Togol)</th>

                                {/* Print Subheaders (Ya / Tidak) */}
                                <th className="p-1 border-r border-slate-300 text-center w-10 print-show-col">Ya</th>
                                <th className="p-1 border-r border-slate-300 text-center w-10 print-show-col">Tidak</th>
                              </tr>
                            </thead>

                            <tbody className="divide-y divide-slate-200">
                              {cu.was.map(wa => {
                                const gId = `${cu.id}-${wa.id}`;
                                const matchingSubs = [];
                                modules.forEach(m => {
                                  m.subModules.forEach(sm => {
                                    if ((sm.matchedWAs || []).includes(gId)) {
                                      matchingSubs.push({ mod: m, sub: sm });
                                    }
                                  });
                                });

                                const rowSpanCount = Math.max(1, matchingSubs.length);
                                const defaultFulfilled = matchingSubs.length > 0;
                                // Semak sama ada pengguna telah manual override status ini
                                const isFulfilled = manualCompliance[gId] !== undefined ? manualCompliance[gId] : defaultFulfilled;

                                return (
                                  <React.Fragment key={wa.id}>
                                    <tr>
                                      {/* Kolum WA NOSS */}
                                      <td rowSpan={rowSpanCount} className="p-1.5 border-r border-slate-200 text-center font-bold text-indigo-700 bg-slate-50 align-top">
                                        <div className="font-mono text-xs">{wa.id}</div>
                                        <div className="text-[10px] text-slate-500 font-normal leading-tight mt-0.5">{wa.title}</div>
                                        
                                        {/* KOTAK NOTA SUBMODUL BERKAITAN JIKA > 1 */}
                                        {matchingSubs.length > 1 && (
                                          <div 
                                            className="mt-1.5 inline-block bg-teal-50 border border-teal-300 text-teal-800 text-[9px] px-1.5 py-0.5 rounded font-bold shadow-xs"
                                            title={`Dipadankan kepada ${matchingSubs.length} SubModul Agensi: ${matchingSubs.map(s => s.mod.code + '-' + s.sub.name).join(", ")}`}
                                          >
                                            {matchingSubs.length} SubModul Berkaitan
                                          </div>
                                        )}
                                      </td>

                                      <td rowSpan={rowSpanCount} className="p-1.5 border-r border-slate-200 text-slate-700 align-top bg-slate-50/50">
                                        <div className="font-medium text-slate-800 text-[11px]">{wa.rk}</div>
                                        <div className="text-[10px] text-slate-500 font-mono mt-0.5">{wa.rkHours} Jam</div>
                                      </td>

                                      <td rowSpan={rowSpanCount} className="p-1.5 border-r border-slate-200 text-slate-700 align-top bg-slate-50/50">
                                        <div className="font-medium text-slate-800 text-[11px]">{wa.rs}</div>
                                        <div className="text-[10px] text-slate-500 font-mono mt-0.5">{wa.rsHours} Jam</div>
                                      </td>

                                      {/* Sub-baris Agensi 1 (INPUT BOLEH DIPINDA SECARA LANGSUNG) */}
                                      {matchingSubs.length > 0 ? (
                                        <>
                                          <td className="p-1.5 border-r border-slate-200 align-top">
                                            <span className="font-bold text-indigo-700 font-mono">{matchingSubs[0].mod.code}</span>
                                            <div className="text-[11px] text-slate-800 font-medium">{matchingSubs[0].sub.name}</div>
                                            {matchingSubs[0].sub.matchedWAs.length > 1 && (
                                              <div className="mt-1 inline-block bg-indigo-50 border border-indigo-200 text-indigo-700 text-[9px] px-1 py-0.2 rounded font-medium no-print">
                                                {matchingSubs[0].sub.matchedWAs.length} WA Berkaitan
                                              </div>
                                            )}
                                          </td>
                                          <td className="p-1 border-r border-slate-200 align-top text-slate-700">
                                            <textarea
                                              value={matchingSubs[0].sub.knowledge}
                                              onChange={(e) => handleUpdateSubModuleField(matchingSubs[0].mod.id, matchingSubs[0].sub.subId, 'knowledge', e.target.value)}
                                              rows="2"
                                              className="w-full text-[11px] p-1 border border-slate-200 rounded focus:ring-1 focus:ring-indigo-500 bg-white"
                                            />
                                          </td>
                                          <td className="p-1 border-r border-slate-200 text-center font-mono align-top">
                                            <input
                                              type="number"
                                              value={matchingSubs[0].sub.rkHours}
                                              onChange={(e) => handleUpdateSubModuleField(matchingSubs[0].mod.id, matchingSubs[0].sub.subId, 'rkHours', Number(e.target.value))}
                                              className="w-12 text-center text-xs p-1 border border-slate-200 rounded focus:ring-1 focus:ring-indigo-500 bg-white"
                                            />
                                          </td>
                                          <td className="p-1 border-r border-slate-200 align-top text-slate-700">
                                            <textarea
                                              value={matchingSubs[0].sub.skills}
                                              onChange={(e) => handleUpdateSubModuleField(matchingSubs[0].mod.id, matchingSubs[0].sub.subId, 'skills', e.target.value)}
                                              rows="2"
                                              className="w-full text-[11px] p-1 border border-slate-200 rounded focus:ring-1 focus:ring-indigo-500 bg-white"
                                            />
                                          </td>
                                          <td className="p-1 border-r border-slate-200 text-center font-mono align-top">
                                            <input
                                              type="number"
                                              value={matchingSubs[0].sub.rsHours}
                                              onChange={(e) => handleUpdateSubModuleField(matchingSubs[0].mod.id, matchingSubs[0].sub.subId, 'rsHours', Number(e.target.value))}
                                              className="w-12 text-center text-xs p-1 border border-slate-200 rounded focus:ring-1 focus:ring-indigo-500 bg-white"
                                            />
                                          </td>
                                        </>
                                      ) : (
                                        <td colSpan="5" className="p-2 text-center text-rose-500 font-medium bg-rose-50/40 text-[11px]">
                                          Tiada modul agensi dipadankan
                                        </td>
                                      )}

                                      {/* UI: 1 KOLUM SAHAJA DENGAN TOGOL INTERAKTIF */}
                                      <td rowSpan={rowSpanCount} className="p-1.5 border-r border-slate-200 text-center align-middle no-print">
                                        <button
                                          onClick={() => toggleComplianceStatus(gId, defaultFulfilled)}
                                          className={`px-2 py-1 rounded text-xs font-bold transition flex items-center justify-center gap-1 mx-auto shadow-xs ${isFulfilled ? 'bg-emerald-100 hover:bg-emerald-200 text-emerald-800 border border-emerald-300' : 'bg-rose-100 hover:bg-rose-200 text-rose-800 border border-rose-300'}`}
                                          title="Klik untuk ubah pilihan Memenuhi/Tidak"
                                        >
                                          <span>{isFulfilled ? "✓ Ya" : "✗ Tidak"}</span>
                                        </button>
                                      </td>

                                      {/* PRINT: 2 KOLUM (Ya / Tidak) */}
                                      <td rowSpan={rowSpanCount} className="p-1.5 border-r border-slate-200 text-center font-bold text-slate-900 align-middle print-show-col">
                                        {isFulfilled ? "Ya" : ""}
                                      </td>
                                      <td rowSpan={rowSpanCount} className="p-1.5 border-r border-slate-200 text-center font-bold text-slate-900 align-middle print-show-col">
                                        {!isFulfilled ? "Tidak" : ""}
                                      </td>

                                      {/* Catatan Jurang (Boleh Dipinda / Disunting Langsung) */}
                                      <td rowSpan={rowSpanCount} className="p-1 text-slate-600 text-[10px] align-middle">
                                        <textarea
                                          value={gapRemarks[gId] !== undefined ? gapRemarks[gId] : (isFulfilled ? "Memenuhi standard minimum." : "Kandungan tiada dalam modul agensi.")}
                                          onChange={(e) => setGapRemarks({ ...gapRemarks, [gId]: e.target.value })}
                                          rows="2"
                                          placeholder="Catatan jurang penilaian..."
                                          className="w-full text-[11px] p-1 border border-slate-200 rounded focus:ring-1 focus:ring-indigo-500 bg-white"
                                        />
                                      </td>
                                    </tr>

                                    {/* Multi-Module Matching Rows (Boleh Dipinda) */}
                                    {matchingSubs.slice(1).map((item, sIdx) => (
                                      <tr key={sIdx} className="bg-slate-50/30">
                                        <td className="p-1.5 border-r border-slate-200 align-top">
                                          <span className="font-bold text-indigo-700 font-mono">{item.mod.code}</span>
                                          <div className="text-[11px] text-slate-800 font-medium">{item.sub.name}</div>
                                          {item.sub.matchedWAs.length > 1 && (
                                            <div className="mt-1 inline-block bg-indigo-50 border border-indigo-200 text-indigo-700 text-[9px] px-1 py-0.2 rounded font-medium no-print">
                                              {item.sub.matchedWAs.length} WA Berkaitan
                                            </div>
                                          )}
                                        </td>
                                        <td className="p-1 border-r border-slate-200 align-top text-slate-700">
                                          <textarea
                                            value={item.sub.knowledge}
                                            onChange={(e) => handleUpdateSubModuleField(item.mod.id, item.sub.subId, 'knowledge', e.target.value)}
                                            rows="2"
                                            className="w-full text-[11px] p-1 border border-slate-200 rounded focus:ring-1 focus:ring-indigo-500 bg-white"
                                          />
                                        </td>
                                        <td className="p-1 border-r border-slate-200 text-center font-mono align-top">
                                          <input
                                            type="number"
                                            value={item.sub.rkHours}
                                            onChange={(e) => handleUpdateSubModuleField(item.mod.id, item.sub.subId, 'rkHours', Number(e.target.value))}
                                            className="w-12 text-center text-xs p-1 border border-slate-200 rounded focus:ring-1 focus:ring-indigo-500 bg-white"
                                          />
                                        </td>
                                        <td className="p-1 border-r border-slate-200 align-top text-slate-700">
                                          <textarea
                                            value={item.sub.skills}
                                            onChange={(e) => handleUpdateSubModuleField(item.mod.id, item.sub.subId, 'skills', e.target.value)}
                                            rows="2"
                                            className="w-full text-[11px] p-1 border border-slate-200 rounded focus:ring-1 focus:ring-indigo-500 bg-white"
                                          />
                                        </td>
                                        <td className="p-1 border-r border-slate-200 text-center font-mono align-top">
                                          <input
                                            type="number"
                                            value={item.sub.rsHours}
                                            onChange={(e) => handleUpdateSubModuleField(item.mod.id, item.sub.subId, 'rsHours', Number(e.target.value))}
                                            className="w-12 text-center text-xs p-1 border border-slate-200 rounded focus:ring-1 focus:ring-indigo-500 bg-white"
                                          />
                                        </td>
                                      </tr>
                                    ))}
                                  </React.Fragment>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    );
                  })}
                </div>

              </div>
            )}

          </main>

          <footer className="bg-white border-t border-slate-200 py-2 text-center text-[11px] text-slate-400 no-print">
            Sistem Pemetaan Kurikulum & NOSS Bersepadu © 2026
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
